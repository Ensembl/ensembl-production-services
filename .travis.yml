language: python
os: linux
dist: xenial
python:
  - "3.12"
services:
  - mysql
env:
  - DB=mysql DEBUG=f
before_script:
  - mysql -u root -e "CREATE USER 'ensembl'@'localhost' IDENTIFIED BY '';"
  - mysql -u root -e "GRANT ALL ON *.* TO 'ensembl'@'localhost';"
  - cp .env.dist .env
install:
  - pip install '.[test]'
script:
  - coverage run --source='.' ./src/manage.py test ensembl.production.portal.tests
